# .claude/gate.conf — profile: ssl  (managed: replaced on upgrade — put overrides in .claude/gate.local.conf)
PROFILE=ssl

# Folders checked by check_rules.sh (space-separated)
RULES_SCOPE="lib/features"

# Banned patterns: "regex|||message" — one per line (ERE). Comment lines are ignored.
BANNED_PATTERNS='
(^|[^A-Za-z_.])(Text|ElevatedButton|TextButton|OutlinedButton|TextFormField|DropdownButton|CircularProgressIndicator|AppBar)\(|||Use the Global* widget (see PROJECT_CONVENTIONS.md → Widget Substitution Table)
[^A-Za-z_]as (String|int|double|bool|num)\??([^A-Za-z_]|$)|||Raw cast — use SafeJson.as*()
Color\(0x|||Hardcoded color — use AppColors
Image\.asset\(|||Use GlobalImageLoader + k_assets enum
showSnackBar\(|||Use ViewUtil.snackbar(context, msg)
(^|[^A-Za-z_.])print\(|||No print() — use the project logger
dotenv|String\.fromEnvironment|||Secrets via envied (Env.*) only
'

# Files that must have a test (globs, matched against the file name)
REQUIRE_TESTS_FOR="*_usecase.dart *_provider.dart *_bloc.dart *_cubit.dart"

# Gate scopes
ANALYZE_SCOPE=changed   # changed: errors anywhere + warnings in changed files | all: whole project
TEST_SCOPE=all          # all: full suite | related: only tests for changed files
