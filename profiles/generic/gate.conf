# .claude/gate.conf — profile: generic  (managed: replaced on upgrade — put overrides in .claude/gate.local.conf)
# /bootstrap may add project-specific BANNED_PATTERNS / REQUIRE_TESTS_FOR to .claude/gate.local.conf after you approve them.
PROFILE=generic

RULES_SCOPE="lib"

# Universal checks only — no house style.
BANNED_PATTERNS='
(^|[^A-Za-z_.])print\(|||No print() in lib/ — use a logger that is silent in release
'

REQUIRE_TESTS_FOR="*_usecase.dart *_use_case.dart *_bloc.dart *_cubit.dart *_notifier.dart *_provider.dart *_controller.dart *_viewmodel.dart *_view_model.dart"

ANALYZE_SCOPE=changed
TEST_SCOPE=all
