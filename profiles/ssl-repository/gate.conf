# .claude/gate.conf — profile: ssl-repository  (managed: replaced on upgrade — put overrides in .claude/gate.local.conf)
PROFILE=ssl-repository

RULES_SCOPE="lib/modules"

BANNED_PATTERNS='
(^|[^A-Za-z_.])(Text|ElevatedButton|TextButton|OutlinedButton|TextFormField|DropdownButton|CircularProgressIndicator|AppBar)\(|||Use the Global* widget from lib/global/widget (PROJECT_CONVENTIONS.md → Shared Widgets)
Color\(0x|||Hardcoded color — use KColor.<name>.color
Image\.asset\(|||Use GlobalImageLoader / GlobalSvgLoader + k_assets
showSnackBar\(|||Use ViewUtil.SSLSnackbar(msg)
(^|[^A-Za-z_.])print\(|||No print() — use the project logger
'

REQUIRE_TESTS_FOR="*_controller.dart *_repository.dart *_bloc.dart *_cubit.dart *_notifier.dart *_provider.dart"

ANALYZE_SCOPE=changed
TEST_SCOPE=all
