# Include in .gitlab-ci.yml:  include: { local: 'ci-templates/gitlab-flutter-quality.yml' }
# Same gate as the Claude Code Stop hook — so humans and agents pass the same bar.
flutter-quality:
  image: ghcr.io/cirruslabs/flutter:stable
  stage: test
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  variables:
    GIT_DEPTH: 0
    CHECK_RULES_BASE: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - flutter pub get
    - bash .claude/hooks/stop_gate.sh --manual   # rules + analyzer (changed files) + tests, from .claude/gate.conf
  # Coverage: add `- flutter test --coverage` and an artifacts: block if you publish it.
